# Docker Compose services for Planazo's source adapters.
#
# Each source runs in its own image so a Meta break (Instagram) does not
# affect a TikTok / news / Meetup adapter. `data/sources.yaml` is bind-mounted
# read-only so an operator edits the config on the host and the container
# picks it up on next run (ADR 0006, decision 3).

services:
  sources-instagram:
    image: planazo-sources-instagram:local
    build:
      context: .
      dockerfile: docker/sources-instagram.Dockerfile
    restart: "no"
    environment:
      # Session cookie for logged-in fetch; unset → anonymous mode (ADR 0006,
      # decision 5). Copy the value from a logged-in browser session's
      # `sessionid` cookie.
      INSTAGRAM_SESSION_ID: "${INSTAGRAM_SESSION_ID:-}"
    volumes:
      - ./data/sources.yaml:/app/data/sources.yaml:ro
