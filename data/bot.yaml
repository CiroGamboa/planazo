default_locale: en
locales: [en, es]
messages:
  cmd_start: {en: "sign you up and show this list", es: "date de alta y muestra esta lista"}
  cmd_help: {en: "show this list", es: "muestra esta lista"}
  cmd_me: {en: "show your account and how many preferences you have stored", es: "muestra tu cuenta y cuántas preferencias tienes guardadas"}
  cmd_prefs: {en: "view, set, or remove your preferences", es: "consulta, guarda o elimina tus preferencias"}
  cmd_register: {en: "start or continue your registration", es: "empieza o continúa tu registro"}
  cmd_find: {en: "find events matching a free-text query, with multi-turn clarification", es: "busca eventos que coincidan con una consulta libre, con aclaración multi-turno"}
  command_line: {en: "{command} — {description}", es: "{command} — {description}"}
  start: {en: "Hi {display_name}! You are all set. Here is what I can do:\n\n{commands}", es: "¡Hola {display_name}! Ya estás listo. Esto es lo que puedo hacer:\n\n{commands}"}
  help: {en: "Here is what I can do:\n\n{commands}", es: "Esto es lo que puedo hacer:\n\n{commands}"}
  me: {en: "Your Planazo id: {user_id}\nTelegram: {handle}\nName: {display_name}\nAge: {age}\nLocation: {location}\nLanguage: {language}\nNationality: {nationality}\nPreferences stored: {count}", es: "Tu id de Planazo: {user_id}\nTelegram: {handle}\nNombre: {display_name}\nEdad: {age}\nUbicación: {location}\nIdioma: {language}\nNacionalidad: {nationality}\nPreferencias guardadas: {count}"}
  me_handle: {en: "@{handle}", es: "@{handle}"}
  me_no_handle: {en: "no handle set", es: "sin usuario configurado"}
  me_not_registered: {en: "You haven't finished registration yet. Send /register to get started.", es: "Todavía no has terminado tu registro. Envía /register para empezar."}
  prefs_usage: {en: "Use one of:\n/prefs — list your preferences\n/prefs set <key> <value> — store or replace one\n/prefs remove <key> — delete one", es: "Usa una de estas opciones:\n/prefs — lista tus preferencias\n/prefs set <clave> <valor> — guarda o reemplaza una\n/prefs remove <clave> — elimina una"}
  prefs_empty: {en: "You have no preferences stored.\n\n{usage}", es: "No tienes preferencias guardadas.\n\n{usage}"}
  prefs_list: {en: "Your preferences:\n\n{lines}", es: "Tus preferencias:\n\n{lines}"}
  prefs_line: {en: "{key}: {value}", es: "{key}: {value}"}
  prefs_saved: {en: "Saved {key}: {value}", es: "Guardado {key}: {value}"}
  prefs_removed: {en: "Removed {key}.", es: "Eliminado {key}."}
  prefs_absent: {en: "You have no preference named {key}.", es: "No tienes ninguna preferencia llamada {key}."}
  prefs_rejected: {en: "I did not save that:\n{reasons}", es: "No he guardado eso:\n{reasons}"}
  prefs_violation: {en: "{field}: {problem}", es: "{field}: {problem}"}
  prefs_read_error: {en: "I could not read your stored preferences safely, so none are shown. Try setting the value again.", es: "No he podido leer tus preferencias guardadas de forma segura, así que no se muestra ninguna. Intenta guardar el valor de nuevo."}
  me_preferences_unavailable: {en: "Preferences could not be loaded (user_id={user_id}, handle={handle}). Please try again later.", es: "No se pudieron cargar tus preferencias (user_id={user_id}, handle={handle}). Inténtalo más tarde."}
  edited_command: {en: "I do not re-run an edited command: it would replay the old command against what is stored now, which can undo a later change. Send it again as a new message.", es: "No vuelvo a ejecutar un comando editado: repetiría el comando antiguo sobre lo que hay guardado ahora, lo que podría deshacer un cambio posterior. Envíalo de nuevo como un mensaje nuevo."}
  find_usage: {en: "Send /find followed by what you are looking for. Example: /find music this weekend.", es: "Envía /find seguido de lo que buscas. Por ejemplo: /find música este fin de semana."}
  find_recommendations: {en: "Here are events I found:\n\n{lines}", es: "Estos son los eventos que encontré:\n\n{lines}"}
  find_recommendation_line: {en: "{n}. {title}\n   {when} · {venue} · {category} · {price}", es: "{n}. {title}\n   {when} · {venue} · {category} · {price}"}
  find_recommendation_venue_missing: {en: "venue TBA", es: "lugar por confirmar"}
  find_recommendation_price_free: {en: "free", es: "gratis"}
  find_recommendation_price_eur: {en: "{amount} EUR", es: "{amount} EUR"}
  find_clarification: {en: "{question}\n\nJust reply with your answer.", es: "{question}\n\nSolo responde con tu respuesta."}
  find_detail: {en: "Details for event #{n}:\n\n{summary}", es: "Detalles del evento #{n}:\n\n{summary}"}
  find_no_results: {en: "{message}", es: "{message}"}
  find_no_results_default: {en: "No matching events found. Try broadening the query.", es: "No se han encontrado eventos. Prueba a ampliar la búsqueda."}
  find_error: {en: "Sorry, something went wrong ({error_type}). Try again in a moment.", es: "Lo siento, algo salió mal ({error_type}). Prueba de nuevo en un momento."}
  chat_reply: {en: "{answer}", es: "{answer}"}
  register_display_name: {en: "What name should I use for you?", es: "¿Qué nombre quieres que use para ti?"}
  register_age: {en: "How old are you?", es: "¿Cuántos años tienes?"}
  register_location: {en: "Which city or neighbourhood are you in?", es: "¿En qué ciudad o barrio estás?"}
  register_language: {en: "Which language do you want me to reply in? (en/es)", es: "¿En qué idioma quieres que te responda? (en/es)"}
  register_nationality: {en: "What is your nationality?", es: "¿Cuál es tu nacionalidad?"}
  register_invalid_text: {en: "That doesn't work — send between {min_length} and {max_length} characters.", es: "Eso no vale — envía entre {min_length} y {max_length} caracteres."}
  register_invalid_int_range: {en: "That doesn't work — send a whole number between {minimum} and {maximum}.", es: "Eso no vale — envía un número entero entre {minimum} y {maximum}."}
  register_invalid_locale: {en: "That doesn't work — reply with one of: {locales}.", es: "Eso no vale — responde con una de estas opciones: {locales}."}
  register_complete: {en: "All set! Your profile is saved. Use /me to see it.", es: "¡Todo listo! Tu perfil está guardado. Usa /me para verlo."}
  chat_register_first: {en: "Finish registration first — send /register to get started.", es: "Termina primero el registro — envía /register para empezar."}
  chat_truncated: {en: "Here is what I have so far (the reply was cut short):\n\n{answer}", es: "Esto es lo que tengo hasta ahora (la respuesta se ha cortado):\n\n{answer}"}
  chat_max_steps: {en: "I couldn't finish that within my step limit. Try rephrasing, or ask something more specific.", es: "No he podido terminar eso dentro de mi límite de pasos. Intenta reformularlo o pregunta algo más concreto."}
  chat_provider_error: {en: "Something went wrong while answering that. Please try again in a moment.", es: "Algo ha fallado al responder eso. Inténtalo de nuevo en un momento."}
  queue_ack: {en: "Still working on your last message — I'll get to this one right after.", es: "Todavía estoy con tu último mensaje — atenderé este justo después."}
  queue_overflow: {en: "You're sending messages faster than I can answer them. Please wait for my replies before sending more.", es: "Me estás enviando mensajes más rápido de lo que puedo responder. Espera mis respuestas antes de enviar más."}
registration:
  steps:
    - profile_field: display_name
      prompt: register_display_name
      validation: {kind: text, min_length: 1, max_length: 80}
    - profile_field: age
      prompt: register_age
      validation: {kind: int_range, minimum: 13, maximum: 120}
    - profile_field: location
      prompt: register_location
      validation: {kind: text, min_length: 1, max_length: 120}
    - profile_field: language
      prompt: register_language
      validation: {kind: locale}
    - profile_field: nationality
      prompt: register_nationality
      validation: {kind: text, min_length: 1, max_length: 80}
queue:
  bound: 20
  ack_message: queue_ack
  overflow_message: queue_overflow
