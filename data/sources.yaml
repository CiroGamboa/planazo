# Schema example — replace PLACEHOLDER_* with real public Barcelona venue accounts
# and post URLs before running the scheduler.
#
# The scheduler processes both blocks on every tick:
#   - `accounts:` — discover recent posts on each account via the configured
#     `backend` (`anonymous` default via `curl_cffi` + Meta's `web_profile_info`;
#     `hikerapi` for business venue accounts the anonymous endpoint refuses).
#     Comment out entries whose account you don't want scanned yet.
#   - `posts:` — extract these specific post URLs directly (works from anonymous
#     access via `Post.from_shortcode`; independent of `accounts:` discovery).
#     Successful extractions are idempotent — the composite
#     `UNIQUE(source_url, event_index_in_post)` in `events` locks out
#     re-persistence — so a post entry's `cadence` only gates *failure retry*.
#
# Either block may be empty. A config with only `accounts:`, only `posts:`, both,
# or neither is valid (an empty scan produces an empty tick).
sources:
  instagram:
    default_cadence: "6h"
    default_media_types:
      static_posts: true
      reels: true
      carousels: true
      video_posts: true

    # Scan the recent posts of these accounts. `backend` picks the discovery
    # client the scheduler routes to. Default is `anonymous`; business venue
    # accounts need `hikerapi`.
    #
    # `max_carousel_images` / `max_reel_frames` are optional per-account
    # overrides on the multimodal profile the Extractor uses for this
    # account's posts. Leave both unset for single-venue accounts to
    # inherit the base preset (`ACCOUNT_SCAN` = 5/5 for account-scan
    # ticks — demo-tuned for fast turnaround). Curator / roundup
    # accounts that post many-slides-many-events carousels can set
    # `max_carousel_images` higher (bounded 1..30).
    accounts:
      - url: "https://instagram.com/PLACEHOLDER_CREATOR_ACCOUNT"
        cadence: "24h"
        # backend: "anonymous" — inherits default
      - url: "https://instagram.com/PLACEHOLDER_BUSINESS_VENUE"
        cadence: "24h"
        backend: "hikerapi"
      # Curator account — high-slide-count roundups. Demo-tuned to 5
      # slides for fast turnaround; combined with the partial-save
      # discipline in the delegation brief, this yields real extraction
      # wins on `--tick` without a heavy per-post budget. For
      # production-grade coverage of a full 25-30 slide agenda, bump
      # this to `max_carousel_images: 25`. `--scan-account` inherits the
      # `ACCOUNT_SCAN` default (5) and does NOT read this override — it
      # is discovered ad-hoc.
      - url: "https://instagram.com/planesenbarcelona"
        cadence: "24h"
        max_carousel_images: 5

    # Extract these specific post URLs on every tick. URL must match
    # `https://[www.]instagram.com/{p|reel}/<shortcode>/…` — account URLs pasted
    # here are rejected at load time by the Pydantic validator.
    posts:
      - url: "https://www.instagram.com/p/PLACEHOLDER_SHORTCODE_1/"
      - url: "https://www.instagram.com/p/PLACEHOLDER_SHORTCODE_2/"
        cadence: "24h"
