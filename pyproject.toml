[project]
name = "planazo-agent"
version = "0.1.0"
description = "Planazo's event-discovery agent runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "openai>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "instaloader>=4.14,<5",
    "python-telegram-bot>=22.8,<23",
    "ffmpeg-python>=0.2,<0.3",
    "curl-cffi>=0.7,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6",
]

[project.scripts]
planazo-agent = "planazo.agents.cli:main"
planazo-monitor = "planazo.monitor.cli:main"
planazo-scheduler = "planazo.scheduler.cli:main"
planazo-sources-instagram = "planazo.sources.instagram.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planazo", "src/agentlib", "src/tools"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits real external services (LLM providers, Instagram); opt-in via `pytest -m live`",
]
